name: Check for new jobs

on:
  schedule:
    # ~7:00 AM and ~5:00 PM Pacific (Actions cron is UTC and may drift a few minutes)
    - cron: "0 14 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape and notify
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scraper/main.py

      - name: Commit updated job data
        run: |
          git config user.name "job-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          git diff --cached --quiet || git commit -m "Update job data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
